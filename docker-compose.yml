networks:
  cropdeal-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cropdeal-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cropdeal-net

  config-server:
    build: ./config-server
    container_name: cropdeal-config-server
    restart: on-failure
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    networks:
      - cropdeal-net

  eureka-server:
    build: ./eureka-server
    container_name: cropdeal-eureka-server
    restart: on-failure
    ports:
      - "8761:8761"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    networks:
      - cropdeal-net

  api-gateway:
    build: ./api-gateway
    container_name: cropdeal-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - AUTH_SERVICE_URI=lb://auth-service
      - USER_SERVICE_URI=lb://user-service
      - CROP_SERVICE_URI=lb://crop-service
      - PRICE_SERVICE_URI=lb://price-service
      - NEGOTIATION_SERVICE_URI=lb://negotiation-service
      - BIDDING_SERVICE_URI=lb://bidding-service
      - WALLET_SERVICE_URI=lb://wallet-service
      - ORDER_SERVICE_URI=lb://order-service
      - PAYMENT_SERVICE_URI=lb://payment-service
      - INVOICE_SERVICE_URI=lb://invoice-service
      - DELIVERY_SERVICE_URI=lb://deliveryservice
      - NOTIFICATION_SERVICE_URI=lb://notification-service
      - CHATBOT_SERVICE_URI=lb://chatbot-service
      - PRICE_ALERT_SERVICE_URI=lb://price-alert-service
      - REPORT_SERVICE_URI=lb://report-service
      - SPRING_RABBITMQ_HOST=rabbitmq
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
      - rabbitmq
    networks:
      - cropdeal-net

  auth-service:
    build: ./auth-service
    container_name: cropdeal-auth-service
    restart: on-failure
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/cropdeal_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=mohan
      - SPRING_DATASOURCE_PASSWORD=Mohan@2004
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - USER_SERVICE_URL=http://user-service:8082
      - PRICE_ALERT_SERVICE_URL=http://price-alert-service:8094
      - FACEBOOK_CLIENT_ID=1863281271349686
      - FACEBOOK_CLIENT_SECRET=acfb65e4f1bee5e87db8211932ff1616
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cropdeal-net

  user-service:
