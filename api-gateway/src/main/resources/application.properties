spring.cloud.gateway.routes[15].id=auth-service-v3-docs
spring.cloud.gateway.routes[15].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[15].predicates[0]=Path=/v3/api-docs/auth-service
