server.port=8080

spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# RabbitMQ configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 0: auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /oauth2/**, /login/oauth2/**

# Route 1: user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**, /api/farmers/**, /api/dealers/**, /api/delivery-partners/**, /api/reviews/**, /api/admin/**

# Route 2: crop-service
spring.cloud.gateway.routes[2].id=crop-service
spring.cloud.gateway.routes[2].uri=${CROP_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/crops/**

# Route 3: price-service
spring.cloud.gateway.routes[3].id=price-service
spring.cloud.gateway.routes[3].uri=${PRICE_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pricing/**, /api/prices/**

# Route 4: negotiation-service
spring.cloud.gateway.routes[4].id=negotiation-service
spring.cloud.gateway.routes[4].uri=${NEGOTIATION_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/negotiations/**

# Route 5: bidding-service
spring.cloud.gateway.routes[5].id=bidding-service
spring.cloud.gateway.routes[5].uri=${BIDDING_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/biddings/**, /api/bids/**

# Route 6: wallet-service
spring.cloud.gateway.routes[6].id=wallet-service
spring.cloud.gateway.routes[6].uri=${WALLET_SERVICE_URI:http://localhost:8087}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/wallet/**, /api/wallets/**

# Route 7: order-service
spring.cloud.gateway.routes[7].id=order-service
spring.cloud.gateway.routes[7].uri=${ORDER_SERVICE_URI:http://localhost:8088}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/orders/**

# Route 8: payment-service
spring.cloud.gateway.routes[8].id=payment-service
spring.cloud.gateway.routes[8].uri=${PAYMENT_SERVICE_URI:http://localhost:8089}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/payments/**, /api/refunds/**

# Route 9: invoice-service
spring.cloud.gateway.routes[9].id=invoice-service
spring.cloud.gateway.routes[9].uri=${INVOICE_SERVICE_URI:http://localhost:8090}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/invoices/**

# Route 10: delivery-service
spring.cloud.gateway.routes[10].id=delivery-service
spring.cloud.gateway.routes[10].uri=${DELIVERY_SERVICE_URI:http://localhost:8091}
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/deliveries/**,/api/delivery-agents/**

# Route 11: notification-service
spring.cloud.gateway.routes[11].id=notification-service
spring.cloud.gateway.routes[11].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8092}
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/notifications, /api/notifications/**
spring.cloud.gateway.routes[11].predicates[1]=Method=GET,PUT,DELETE

# Route 12: chatbot-service
spring.cloud.gateway.routes[12].id=chatbot-service
spring.cloud.gateway.routes[12].uri=${CHATBOT_SERVICE_URI:http://localhost:8096}
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/chat/**,/api/chatbot/**,/api/v1/chatbot/**

# Route 13: price-alert-service
spring.cloud.gateway.routes[13].id=price-alert-service
spring.cloud.gateway.routes[13].uri=${PRICE_ALERT_SERVICE_URI:http://localhost:8094}
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/price-alerts/**,/api/buying-requests/**

# Route 14: report-service
spring.cloud.gateway.routes[14].id=report-service
spring.cloud.gateway.routes[14].uri=${REPORT_SERVICE_URI:http://localhost:8095}
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/reports/**

# Swagger OpenAPI documentation routes
