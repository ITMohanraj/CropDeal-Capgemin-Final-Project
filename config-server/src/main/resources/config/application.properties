# =========================================================
# COMMON CROPDEAL PLATFORM CONFIGURATION (SHARED ACROSS ALL SERVICES)
# =========================================================

# Service Discovery (Eureka)
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Database Credentials & Common Settings
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:mohan}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Mohan@2004}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Message Broker (RabbitMQ)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:rabbitmq}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

# Security & JWT Tokens
jwt.secret=${JWT_SECRET:CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger & OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
